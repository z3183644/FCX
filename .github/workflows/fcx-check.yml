name: FCX checks

on:
  push:
    branches:
      - main
      - github
  pull_request:

permissions:
  contents: read

jobs:
  userscript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FCX
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FCX/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run complete FCX checks
        run: npm run check

      - name: Build Greasy Fork distribution
        run: npm run build:greasyfork

      - name: Verify committed Greasy Fork distribution
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- FCX/greasyfork

  backend:
    strategy:
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run backend tests
        run: python -m pytest backend/tests -q
